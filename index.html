<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de Billar 3 Bandas Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* TEMA GLOBAL */
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(rgba(10, 15, 20, 0.85), rgba(10, 15, 20, 0.95)), url('https://images.unsplash.com/photo-1599566219227-2efe0c9b7f5f?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; color: #ecf0f1; margin: 0; padding: 0; min-height: 100vh; }
        h1, h2, h3 { text-align: center; color: #00d8d6; text-transform: uppercase; letter-spacing: 2px; }
        
        /* NAVEGACIÓN */
        .navbar { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); padding: 20px; text-align: center; border-bottom: 1px solid rgba(0, 216, 214, 0.3); position: sticky; top: 0; z-index: 100; }
        .tab-btn { background-color: transparent; color: #ecf0f1; border: 2px solid #00d8d6; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 30px; margin: 5px; transition: all 0.3s ease; }
        .tab-btn.activa, .tab-btn:hover { background-color: #00d8d6; color: #1e272e; box-shadow: 0 0 15px rgba(0, 216, 214, 0.6); }

        /* CONTENEDORES */
        .seccion { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; animation: fadeIn 0.5s ease-in-out; }
        .seccion.activa { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: rgba(30, 39, 46, 0.75); backdrop-filter: blur(15px); padding: 25px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 30px; }

        /* FORMULARIOS */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #00d8d6; font-size: 13px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); background-color: rgba(0,0,0,0.5); color: white; border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: 'Montserrat', sans-serif; }
        input[type="time"] { cursor: pointer; }
        
        .checkbox-container { display: flex; align-items: center; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; border: 1px solid rgba(0,216,214,0.3); cursor: pointer; }
        .checkbox-container input { width: auto; margin-right: 15px; transform: scale(1.5); cursor: pointer; }
        .checkbox-container label { margin-bottom: 0; font-size: 15px; color: #0be881; cursor: pointer; }

        button.btn-accion { width: 100%; padding: 15px; background: linear-gradient(45deg, #05c46b, #0be881); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        button.btn-accion:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(11, 232, 129, 0.6); }

        /* TABLAS Y AVATARES */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0,0,0,0.4); border-radius: 8px; overflow: hidden; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        th { background-color: rgba(0, 216, 214, 0.2); color: #00d8d6; text-transform: uppercase; font-size: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #00d8d6; margin-right: 10px; vertical-align: middle; background-color: #2f3640; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; color: white; text-transform: uppercase; }
        .bg-master { background: linear-gradient(45deg, #ff3f34, #ff5e57); }
        .bg-intermedio { background: linear-gradient(45deg, #ffa801, #ffc048); }
        .bg-amateur { background: linear-gradient(45deg, #0fbcf9, #4bcffa); }

        /* TORNEO Y MESAS */
        .controls-torneo { display: flex; gap: 15px; justify-content: center; align-items: flex-end; margin-bottom: 30px; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; flex-wrap: wrap; }
        .btn-sorteo { background: linear-gradient(45deg, #ffa801, #ffd32a); color: #000; border: none; padding: 12px 25px; font-size: 14px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-sorteo:hover { transform: scale(1.05); }
        .btn-terminar { background: linear-gradient(45deg, #ff3f34, #ff5e57); color: white; border: none; padding: 12px 25px; font-size: 14px; font-weight: 800; border-radius: 8px; cursor: pointer; display: none; transition: 0.3s; }
        .btn-terminar:hover { box-shadow: 0 0 15px rgba(255, 63, 52, 0.8); }

        .fase-grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px; justify-items: center; }
        .grupo { width: 100%; max-width: 450px; background: rgba(20, 25, 30, 0.8); border-top: 4px solid #00d8d6; border-radius: 10px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .grupo h3 { margin-top: 0; color: #ffd32a; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; font-size: 18px; }
        
        .mesa-billar { width: 100%; box-sizing: border-box; background: url('https://www.transparenttextures.com/patterns/felt.png'), linear-gradient(to bottom, #006266, #004d40); border: 10px solid #5c2c16; border-radius: 10px; padding: 15px; padding-top: 35px; margin-bottom: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); text-align: center; position: relative; }
        .horario { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: #000; color: #00d8d6; padding: 4px 15px; font-size: 12px; font-weight: bold; border-radius: 0 0 8px 8px; letter-spacing: 1px; }
        
        .jugador-mesa { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; margin: 5px 0; border-left: 3px solid #00d8d6; }
        .jugador-info { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; }
        
        .inputs-marcador { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; }
        .input-score { width: 45%; text-align: center; font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.9); color: #000; }
        .btn-guardar-score { background: #05c46b; border: none; color: white; width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-guardar-score:hover { filter: brightness(1.1); }
        .btn-fase-final { background: linear-gradient(45deg, #ff3f34, #ff5e57); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; display: none; box-shadow: 0 5px 15px rgba(255, 63, 52, 0.4); }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="tab-btn activa" onclick="cambiarPestana('inscripcion', this)">📝 Registro Oficial</button>
        <button class="tab-btn" onclick="cambiarPestana('torneo', this)">🎱 Fase de Grupos</button>
        <button class="tab-btn" onclick="cambiarPestana('finales', this)">🏆 Muerte Súbita</button>
    </div>

    <!-- SECCIÓN 1: INSCRIPCIÓN -->
    <div id="seccion-inscripcion" class="seccion activa">
        <h1>Inscripción al Torneo</h1>
        <div class="card">
            <form id="registroForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Torbjörn Blomdahl" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría Asignada</label>
                    <select id="categoria" required>
                        <option value="">Selecciona el nivel...</option>
                        <option value="Master">⭐ Master (Meta: 25)</option>
                        <option value="Intermedio">⚡ Intermedio (Meta: 20)</option>
                        <option value="Amateur">🎯 Amateur (Meta: 12)</option>
                    </select>
                </div>
                <div class="form-group">
                    <div class="checkbox-container">
                        <input type="checkbox" id="pagado">
                        <label for="pagado">Inscripción Pagada (Al día)</label>
                    </div>
                </div>
                <button type="submit" class="btn-accion" id="btnGuardar">Registrar Jugador</button>
            </form>
        </div>

        <div class="card">
            <h2>Participantes Registrados (<span id="contador" style="color: #00d8d6;">0</span>)</h2>
            <p style="text-align: center; color: #aaa; font-size: 14px;">Aptos para el sorteo: <strong id="contadorAptos" style="color:#0be881;">0</strong></p>
            <table>
                <thead><tr><th>Jugador</th><th>Nivel</th><th>Meta</th><th style="text-align: center;">Estado</th></tr></thead>
                <tbody id="listaJugadores"></tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN 2: FASE DE GRUPOS -->
    <div id="seccion-torneo" class="seccion">
        <h1>Fase de Grupos</h1>
        <div class="controls-torneo">
            <div class="form-group" style="margin: 0; width: 200px;" id="divHoraInicio">
                <label>Hora de Inicio (Grupos)</label>
                <input type="time" id="horaInicio" value="18:00">
            </div>
            <button class="btn-sorteo" id="btnSorteo">🎲 Generar Sorteo (Solo Admin)</button>
            <button class="btn-terminar" id="btnTerminarTorneo" onclick="terminarTorneoOficial()">🛑 Finalizar Torneo Actual</button>
        </div>
        <div class="fase-grupos" id="contenedorGrupos"></div>
        <button class="btn-fase-final" id="btnGenerarFinales" onclick="generarFaseFinal()">🏆 Iniciar Muerte Súbita (Comenzará a las 6:00 PM)</button>
    </div>

    <!-- SECCIÓN 3: FASE FINAL -->
    <div id="seccion-finales" class="seccion">
        <h1>Eliminación Directa</h1>
        <div id="contenedorFinales">
            <p style="text-align: center; width: 100%;">La fase final se construirá aquí automáticamente conservando los horarios de cada partida.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ¡RECUERDA PONER TUS CLAVES EXACTAS DE FIREBASE AQUÍ!
        const firebaseConfig = {
            apiKey: "AIzaSyB10yXxA6Oyvz-xDyJuX7RKj7QhNju85mo",
            authDomain: "mansioncarambola.firebaseapp.com",
            projectId: "mansioncarambola",
            storageBucket: "mansioncarambola.firebasestorage.app",
            messagingSenderId: "782227033522",
            appId: "1:782227033522:web:70f029b38617dfff21a8ab",
            measurementId: "G-MKBCHYQ86T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const reglas = { "Master": { meta: 25, color: "bg-master" }, "Intermedio": { meta: 20, color: "bg-intermedio" }, "Amateur": { meta: 12, color: "bg-amateur" } };
        window.inscritosGlobal = [];
        window.grupos = [];
        window.faseEliminacion = { rondas: [], rondaActiva: 0 };
        window.torneoActivo = false;

        // --- SISTEMA DE GUARDADO PERSISTENTE Y BLOQUEO ESTRICTO ---
        async function guardarEstadoTorneo() {
            try { 
                await setDoc(doc(db, "torneos", "actual"), { 
                    activo: window.torneoActivo, 
                    grupos: window.grupos, 
                    faseEliminacion: window.faseEliminacion 
                }); 
            } 
            catch (error) { console.error("Error al guardar estado:", error); }
        }

        async function cargarEstadoTorneo() {
            try {
                const docSnap = await getDoc(doc(db, "torneos", "actual"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.torneoActivo = data.activo || false;
                    
                    if(window.torneoActivo) {
                        window.grupos = data.grupos || [];
                        window.faseEliminacion = data.faseEliminacion || { rondas: [], rondaActiva: 0 };
                        
                        document.getElementById('btnSorteo').style.display = 'none';
                        document.getElementById('divHoraInicio').style.display = 'none';
                        document.getElementById('btnTerminarTorneo').style.display = 'inline-block';
                        
                        if (window.grupos.length > 0) { 
                            renderizarGrupos(); 
                            if(window.faseEliminacion.rondas.length === 0) {
                                document.getElementById('btnGenerarFinales').style.display = 'block';
                            } else {
                                document.getElementById('btnGenerarFinales').style.display = 'none';
                            }
                        }
                        if (window.faseEliminacion.rondas.length > 0) { renderizarFaseFinal(); }
                    }
                }
            } catch (error) { console.error("Error al cargar torneo:", error); }
        }
        cargarEstadoTorneo();

        // Botón de Reset Oficial
        window.terminarTorneoOficial = async function() {
            if(confirm("¡ATENCIÓN! ¿Estás completamente seguro de finalizar y borrar el torneo actual? Esto limpiará los grupos y eliminatorias.")) {
                window.torneoActivo = false;
                window.grupos = [];
                window.faseEliminacion = { rondas: [], rondaActiva: 0 };
                await guardarEstadoTorneo();
                location.reload(); 
            }
        };

        // Navegación
        window.cambiarPestana = function(idSeccion, botonRef) {
            document.querySelectorAll('.seccion').forEach(sec => sec.classList.remove('activa'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('activa'));
            document.getElementById(`seccion-${idSeccion}`).classList.add('activa');
            botonRef.classList.add('activa');
        };

        // Guardar Jugador
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true; btn.textContent = 'Guardando...';

            const nombre = document.getElementById('nombre').value;
            const categoria = document.getElementById('categoria').value;
            const pagado = document.getElementById('pagado').checked; // Toma el estado del checkbox
            const semilla = encodeURIComponent(nombre + Math.random());
            const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${semilla}`;

            try {
                await addDoc(collection(db, "jugadores"), {
                    nombre, categoria, pagado, foto: avatarUrl,
                    meta: reglas[categoria].meta, claseColor: reglas[categoria].color,
                    fechaRegistro: new Date()
                });
                this.reset();
            } catch (error) { alert("Error al guardar."); } 
            finally { btn.disabled = false; btn.textContent = 'Registrar Jugador'; }
        });

        // Leer datos
        onSnapshot(query(collection(db, "jugadores"), orderBy("fechaRegistro", "desc")), (snapshot) => {
            const tbody = document.getElementById('listaJugadores');
            tbody.innerHTML = ''; window.inscritosGlobal = []; 
            let aptosParaSorteo = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                window.inscritosGlobal.push({ id: doc.id, ...data });
                
                if (data.pagado) aptosParaSorteo++;
                
                const iconoEstado = data.pagado ? '<span style="color: #0be881; font-size: 20px;" title="Inscripción al día">✅</span>' : '<span style="color: #ff3f34; font-size: 20px;" title="Pendiente de pago">❌</span>';

                tbody.innerHTML += `<tr>
                    <td><div style="display:flex; align-items:center;"><img src="${data.foto}" class="avatar"> <strong>${data.nombre}</strong></div></td>
                    <td><span class="badge ${data.claseColor}">${data.categoria}</span></td>
                    <td>${data.meta}</td>
                    <td style="text-align: center;">${iconoEstado}</td>
                </tr>`;
            });
            document.getElementById('contador').textContent = window.inscritosGlobal.length;
            document.getElementById('contadorAptos').textContent = aptosParaSorteo;
        });

        function calcularHora(horaInicio, indice) {
            const [h, m] = horaInicio.split(':').map(Number);
            const d = new Date(); d.setHours(h, m + (indice * 45), 0);
            return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // --- FASE DE GRUPOS ---
        document.getElementById('btnSorteo').addEventListener('click', async () => {
            // VERIFICACIÓN DE CONTRASEÑA ADMINISTRATIVA
            const password = prompt("Seguridad del Sistema:\nIngrese la contraseña de administrador para generar el sorteo:");
            if (password !== "2026*") {
                alert("❌ Contraseña incorrecta. Solo los administradores pueden generar el sorteo.");
                return;
            }

            // FILTRAR SOLO A LOS QUE ESTÁN AL DÍA
            const jugadoresAptos = window.inscritosGlobal.filter(jugador => jugador.pagado === true);

            if (jugadoresAptos.length < 4) { 
                alert(`Mínimo 4 jugadores con inscripción pagada (al día) para armar grupos.\nActualmente solo hay ${jugadoresAptos.length} aptos.`); 
                return; 
            }
            
            if (confirm(`Se realizará el sorteo con ${jugadoresAptos.length} jugadores aptos. El torneo quedará bloqueado. ¿Continuar?`)) {
                window.torneoActivo = true; 
                
                const horaInicio = document.getElementById('horaInicio').value;
                let mezclados = [...jugadoresAptos].sort(() => Math.random() - 0.5);
                window.grupos = [];
                window.faseEliminacion = { rondas: [], rondaActiva: 0 };

                for (let i = 0; i < mezclados.length; i += 4) {
                    let p = mezclados.slice(i, i + 4).map(j => ({ ...j, pts: 0, car: 0, pj: 0 }));
                    let partidos = [];
                    if(p.length >= 2) partidos.push({ j1: p[0], j2: p[1], s1: '', s2: '', jugado: false });
                    if(p.length >= 3) partidos.push({ j1: p[0], j2: p[2], s1: '', s2: '', jugado: false }, { j1: p[1], j2: p[2], s1: '', s2: '', jugado: false });
                    if(p.length === 4) {
                        partidos = [
                            { j1: p[0], j2: p[1], s1: '', s2: '', jugado: false }, { j1: p[2], j2: p[3], s1: '', s2: '', jugado: false },
                            { j1: p[0], j2: p[2], s1: '', s2: '', jugado: false }, { j1: p[1], j2: p[3], s1: '', s2: '', jugado: false },
                            { j1: p[0], j2: p[3], s1: '', s2: '', jugado: false }, { j1: p[1], j2: p[2], s1: '', s2: '', jugado: false }
                        ];
                    }
                    
                    partidos.forEach((partido, idx) => { partido.hora = calcularHora(horaInicio, idx); });
                    window.grupos.push({ nombre: `GRUPO ${String.fromCharCode(65 + (i/4))}`, participantes: p, partidos: partidos });
                }
                
                document.getElementById('btnSorteo').style.display = 'none';
                document.getElementById('divHoraInicio').style.display = 'none';
                document.getElementById('btnTerminarTorneo').style.display = 'inline-block';
                document.getElementById('btnGenerarFinales').style.display = 'block';

                renderizarGrupos();
                await guardarEstadoTorneo();
            }
        });

        window.guardarResultadoGrupo = async function(gIdx, pIdx) {
            const s1 = parseInt(document.getElementById(`g${gIdx}p${pIdx}s1`).value) || 0;
            const s2 = parseInt(document.getElementById(`g${gIdx}p${pIdx}s2`).value) || 0;
            const grupo = window.grupos[gIdx];
            const partido = grupo.partidos[pIdx];

            if(partido.jugado) return;
            partido.s1 = s1; partido.s2 = s2; partido.jugado = true;

            let j1 = grupo.participantes.find(p => p.id === partido.j1.id);
            let j2 = grupo.participantes.find(p => p.id === partido.j2.id);
            
            j1.car += s1; j1.pj += 1;
            j2.car += s2; j2.pj += 1;

            if (s1 > s2) j1.pts += 3;
            else if (s2 > s1) j2.pts += 3;
            else { j1.pts += 1; j2.pts += 1; }

            grupo.participantes.sort((a, b) => b.pts - a.pts || b.car - a.car);
            
            renderizarGrupos();
            await guardarEstadoTorneo();
        };

        function renderizarGrupos() {
            const contenedor = document.getElementById('contenedorGrupos');
            contenedor.innerHTML = '';
            window.grupos.forEach((grupo, gIdx) => {
                let html = `<div class="grupo"><h3>${grupo.nombre}</h3>
                <table class="tabla-posiciones" style="margin-bottom:15px; font-size: 12px;">
                    <tr><th>Jugador</th><th>PJ</th><th>Pts</th><th>Car</th></tr>`;
                grupo.participantes.forEach(p => {
                    html += `<tr><td><img src="${p.foto}" class="avatar" style="width:20px;height:20px;"> ${p.nombre}</td><td>${p.pj}</td><td><strong>${p.pts}</strong></td><td>${p.car}</td></tr>`;
                });
                html += `</table>`;

                grupo.partidos.forEach((partido, pIdx) => {
                    html += `<div class="mesa-billar">
                        <div class="horario">🕒 ${partido.hora} - 🏁 ${calcularHora(partido.hora, 1)}</div>
                        <div style="margin-top: 15px;">
                            <div class="jugador-mesa"><div class="jugador-info"><img src="${partido.j1.foto}" class="avatar">${partido.j1.nombre}</div><span class="badge ${partido.j1.claseColor}">${partido.j1.meta}</span></div>
                            <div class="jugador-mesa"><div class="jugador-info"><img src="${partido.j2.foto}" class="avatar">${partido.j2.nombre}</div><span class="badge ${partido.j2.claseColor}">${partido.j2.meta}</span></div>
                        </div>`;
                    
                    if(!partido.jugado) {
                        html += `
                        <div class="inputs-marcador">
                            <input type="number" id="g${gIdx}p${pIdx}s1" class="input-score" placeholder="Pts">
                            <input type="number" id="g${gIdx}p${pIdx}s2" class="input-score" placeholder="Pts">
                        </div>
                        <button class="btn-guardar-score" onclick="guardarResultadoGrupo(${gIdx}, ${pIdx})">💾 Guardar Marcador</button>`;
                    } else {
                        html += `<div style="color: #ffd32a; font-size: 20px; font-weight: bold; margin-top: 10px;">${partido.s1} - ${partido.s2}</div>
                        <div style="color: #05c46b; font-size: 12px;">Finalizado</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
                contenedor.innerHTML += html;
            });
        }

        // --- LÓGICA DE FASE FINAL ---
        window.generarFaseFinal = async function() {
            let clasificados = [];
            window.grupos.forEach(grupo => {
                if(grupo.participantes[0]) clasificados.push(grupo.participantes[0]);
                if(grupo.participantes[1]) clasificados.push(grupo.participantes[1]);
            });

            if(clasificados.length < 2) { alert("Mínimo 2 clasificados requeridos."); return; }
            if(!confirm("¿Iniciar fase de muerte súbita? Esto generará el cuadro de eliminatorias.")) return;
            
            const horaInicioFinales = "18:00";
            
            let partidosRonda1 = [];
            for(let i=0; i < clasificados.length / 2; i++) {
                partidosRonda1.push({
                    j1: clasificados[i],
                    j2: clasificados[clasificados.length - 1 - i],
                    s1: 0, s2: 0, jugado: false, ganador: null,
                    hora: calcularHora(horaInicioFinales, i)
                });
            }

            window.faseEliminacion.rondas = [partidosRonda1];
            window.faseEliminacion.rondaActiva = 0;

            document.getElementById('btnGenerarFinales').style.display = 'none';
            renderizarFaseFinal();
            document.querySelectorAll('.tab-btn')[2].click();
            await guardarEstadoTorneo();
        };

        window.guardarMarcadorFinal = async function(rIdx, pIdx) {
            const s1 = parseInt(document.getElementById(`f_r${rIdx}p${pIdx}s1`).value) || 0;
            const s2 = parseInt(document.getElementById(`f_r${rIdx}p${pIdx}s2`).value) || 0;

            if(s1 === s2) { alert("En eliminación directa no hay empates. Determine un ganador."); return; }

            let partido = window.faseEliminacion.rondas[rIdx][pIdx];
            partido.s1 = s1;
            partido.s2 = s2;
            partido.jugado = true;
            partido.ganador = (s1 > s2) ? partido.j1 : partido.j2;

            verificarAvanceRonda(rIdx);
            renderizarFaseFinal();
            await guardarEstadoTorneo(); 
        };

        function verificarAvanceRonda(rIdx) {
            let rondaActual = window.faseEliminacion.rondas[rIdx];
            let todosJugados = rondaActual.every(p => p.jugado);

            if(todosJugados) {
                if(rondaActual.length === 1) {
                    alert(`🎉 ¡TORNEO FINALIZADO! El Campeón es ${rondaActual[0].ganador.nombre} 🎉`);
                    return;
                }

                let ultimaHoraRondaAnterior = rondaActual[rondaActual.length - 1].hora;
                let horaInicioSiguienteRonda = calcularHora(ultimaHoraRondaAnterior, 1);

                let siguienteRonda = [];
                for(let i=0; i < rondaActual.length; i+=2) {
                    siguienteRonda.push({
                        j1: rondaActual[i].ganador,
                        j2: rondaActual[i+1].ganador,
                        s1: 0, s2: 0, jugado: false, ganador: null,
                        hora: calcularHora(horaInicioSiguienteRonda, i/2)
                    });
                }
                window.faseEliminacion.rondas.push(siguienteRonda);
                window.faseEliminacion.rondaActiva++;
            }
        }

        function renderizarFaseFinal() {
            const contenedor = document.getElementById('contenedorFinales');
            contenedor.innerHTML = '';

            window.faseEliminacion.rondas.forEach((ronda, rIdx) => {
                let nombreRonda = ronda.length === 1 ? "🏆 GRAN FINAL" : (ronda.length === 2 ? "SEMIFINALES" : "ELIMINATORIAS");

                let html = `<div style="width: 100%; margin-top: 20px; border-bottom: 2px solid #ff5e57;"><h2 style="color: #ff5e57;">${nombreRonda}</h2></div><div class="fase-grupos">`;

                ronda.forEach((partido, pIdx) => {
                    html += `<div class="mesa-billar" style="border-color: #ff3f34; max-width: 450px; margin: 0 auto 15px;">
                        <div class="horario" style="background: #ff3f34; color: white;">🕒 ${partido.hora} - 🏁 ${calcularHora(partido.hora, 1)}</div>
                        <div style="margin-top: 15px;">
                            <div class="jugador-mesa">
                                <div class="jugador-info"><img src="${partido.j1.foto}" class="avatar">${partido.j1.nombre}</div>
                                <span class="badge ${partido.j1.claseColor}">${partido.j1.meta}</span>
                            </div>
                            <div style="color: #ff5e57; font-weight: bold; margin: 5px 0;">VS</div>
                            <div class="jugador-mesa">
                                <div class="jugador-info"><img src="${partido.j2.foto}" class="avatar">${partido.j2.nombre}</div>
                                <span class="badge ${partido.j2.claseColor}">${partido.j2.meta}</span>
                            </div>
                        </div>`;

                    if(!partido.jugado) {
                        html += `<div class="inputs-marcador">
                            <input type="number" id="f_r${rIdx}p${pIdx}s1" class="input-score" placeholder="Pts">
                            <input type="number" id="f_r${rIdx}p${pIdx}s2" class="input-score" placeholder="Pts">
                        </div>
                        <button class="btn-guardar-score" style="background: linear-gradient(45deg, #ff3f34, #ff5e57);" onclick="guardarMarcadorFinal(${rIdx}, ${pIdx})">💾 Guardar y Avanzar</button>`;
                    } else {
                        html += `<div style="color: #ffd32a; font-size: 24px; font-weight: bold; margin-top: 15px;">${partido.s1} - ${partido.s2}</div>
                        <div style="color: #0be881; font-size: 16px; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;">
                            ⭐ Avanza: ${partido.ganador.nombre}
                        </div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
                contenedor.innerHTML += html;
            });
        }
    </script>
</body>
</html>

<!-- Scripts de Firebase usando Módulos (Estándar moderno) -->
    <script type="module">
        // 1. Importar las funciones necesarias de Firebase directamente desde la web
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. TU CONFIGURACIÓN EXACTA DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB10yXxA6Oyvz-xDyJuX7RKj7QhNju85mo",
            authDomain: "mansioncarambola.firebaseapp.com",
            projectId: "mansioncarambola",
            storageBucket: "mansioncarambola.firebasestorage.app",
            messagingSenderId: "782227033522",
            appId: "1:782227033522:web:70f029b38617dfff21a8ab",
            measurementId: "G-MKBCHYQ86T"
        };

        // 3. Inicializar Firebase y Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const reglas = {
            "Master": { meta: 25, color: "bg-master" },
            "Intermedio": { meta: 20, color: "bg-intermedio" },
            "Amateur": { meta: 12, color: "bg-amateur" }
        };

        // 4. Lógica para guardar un jugador en la base de datos
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.disabled = true; // Desactivar botón mientras guarda
            btnGuardar.textContent = 'Guardando...';

            const nombre = document.getElementById('nombre').value;
            const categoria = document.getElementById('categoria').value;
            const meta = reglas[categoria].meta;
            const claseColor = reglas[categoria].color;

            try {
                // Guardar en la colección "jugadores"
                await addDoc(collection(db, "jugadores"), {
                    nombre: nombre,
                    categoria: categoria,
                    meta: meta,
                    claseColor: claseColor,
                    fechaRegistro: new Date() // Para ordenar la lista
                });
                
                this.reset(); // Limpiar formulario
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar el jugador.");
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Inscribir Jugador';
            }
        });

        // 5. Lógica para leer los datos en tiempo real (Realtime Listener)
        const q = query(collection(db, "jugadores"), orderBy("fechaRegistro", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('listaJugadores');
            const contador = document.getElementById('contador');
            
            tbody.innerHTML = ''; // Limpiar tabla
            let totalJugadores = 0;

            snapshot.forEach((doc) => {
                const jugador = doc.data();
                totalJugadores++;
                
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${jugador.nombre}</td>
                    <td><span class="badge ${jugador.claseColor}">${jugador.categoria}</span></td>
                    <td><strong>${jugador.meta}</strong></td>
                `;
                tbody.appendChild(fila);
            });

            contador.textContent = totalJugadores;
        });
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación del Torneo - Billar 3 Bandas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e272e; color: #fff; margin: 0; padding: 20px; }
        h1, h2 { text-align: center; color: #0fb9b1; }
        .controls { text-align: center; margin-bottom: 30px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 0 10px; transition: transform 0.2s; }
        .btn-sorteo { background-color: #f39c12; color: white; }
        .btn-simular { background-color: #e74c3c; color: white; display: none; }
        button:hover { transform: scale(1.05); }

        /* Estilos de los Grupos */
        .fase-grupos { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .grupo { background-color: #2f3640; border: 2px solid #0fb9b1; border-radius: 10px; padding: 15px; width: 300px; }
        .grupo h3 { margin-top: 0; color: #f1c40f; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .tabla-posiciones { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
        .tabla-posiciones th, .tabla-posiciones td { text-align: left; padding: 5px; border-bottom: 1px solid #444; }
        
        /* Diseño de la Mesa de Billar para los enfrentamientos */
        .mesa-billar { 
            background-color: #006266; /* Paño verde */
            border: 8px solid #8b4513; /* Borde de madera */
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 10px; 
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        /* Detalles visuales de la mesa (bolas de billar) */
        .mesa-billar::before { content: ''; position: absolute; top: 5px; left: 10px; width: 10px; height: 10px; background: white; border-radius: 50%; box-shadow: 20px 5px 0 #f1c40f, 10px 20px 0 white; }
        
        .jugador { font-weight: bold; font-size: 14px; margin: 5px 0; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; }
        .vs { font-size: 12px; color: #ffcccc; font-weight: bold; margin: 5px 0; }
        .marcador { color: #f1c40f; font-size: 16px; font-weight: bold; margin-top: 5px; }
        
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; float: right; }
        .bg-master { background-color: #e74c3c; }
        .bg-intermedio { background-color: #f39c12; }
        .bg-amateur { background-color: #3498db; }
    </style>
</head>
<body>

    <h1>Fase de Grupos - Torneo de Billar</h1>
    
    <div class="controls">
        <button class="btn-sorteo" id="btnSorteo">1. Realizar Sorteo de Grupos</button>
        <button class="btn-simular" id="btnSimular">2. Simular Partidas (Fase de Grupos)</button>
    </div>

    <div class="fase-grupos" id="contenedorGrupos">
        <!-- Los grupos y mesas de billar aparecerán aquí -->
    </div>

    <!-- Scripts de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ¡REEMPLAZA ESTO CON TU CONFIGURACIÓN EXACTA DE FIREBASE!
        const firebaseConfig = {
            apiKey: "AIzaSyB10yXxA6Oyvz-xDyJuX7RKj7QhNju85mo",
            authDomain: "mansioncarambola.firebaseapp.com",
            projectId: "mansioncarambola",
            storageBucket: "mansioncarambola.firebasestorage.app",
            messagingSenderId: "782227033522",
            appId: "1:782227033522:web:70f029b38617dfff21a8ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let jugadoresInscritos = [];
        let grupos = [];

        // Obtener jugadores al cargar
        async function cargarJugadores() {
            const querySnapshot = await getDocs(collection(db, "jugadores"));
            querySnapshot.forEach((doc) => {
                jugadoresInscritos.push({ id: doc.id, ...doc.data(), puntos: 0, carambolas: 0 });
            });
        }
        cargarJugadores();

        // Mezclar arreglo (Algoritmo Fisher-Yates)
        function mezclarArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Lógica del Sorteo
        document.getElementById('btnSorteo').addEventListener('click', () => {
            if (jugadoresInscritos.length < 4) {
                alert("Necesitas al menos 4 jugadores inscritos para hacer un grupo.");
                return;
            }

            let mezclados = mezclarArray([...jugadoresInscritos]);
            grupos = [];
            
            // Dividir en grupos de 4
            for (let i = 0; i < mezclados.length; i += 4) {
                grupos.push({
                    nombre: `Grupo ${String.fromCharCode(65 + (i/4))}`, // Grupo A, B, C...
                    participantes: mezclados.slice(i, i + 4),
                    partidos: []
                });
            }

            // Generar enfrentamientos por grupo (Todos contra todos)
            grupos.forEach(grupo => {
                const p = grupo.participantes;
                if(p.length >= 2) grupo.partidos.push({ j1: p[0], j2: p[1], jugado: false });
                if(p.length >= 4) {
                    grupo.partidos.push({ j1: p[2], j2: p[3], jugado: false });
                    grupo.partidos.push({ j1: p[0], j2: p[2], jugado: false });
                    grupo.partidos.push({ j1: p[1], j2: p[3], jugado: false });
                    grupo.partidos.push({ j1: p[0], j2: p[3], jugado: false });
                    grupo.partidos.push({ j1: p[1], j2: p[2], jugado: false });
                }
            });

            renderizarGrupos();
            document.getElementById('btnSorteo').style.display = 'none';
            document.getElementById('btnSimular').style.display = 'inline-block';
        });

        // Dibujar las mesas de billar y los grupos
        function renderizarGrupos() {
            const contenedor = document.getElementById('contenedorGrupos');
            contenedor.innerHTML = '';

            grupos.forEach(grupo => {
                let html = `<div class="grupo"><h3>${grupo.nombre}</h3>`;
                
                // Tabla de posiciones
                html += `<table class="tabla-posiciones">
                    <tr><th>Jugador</th><th>Pts</th><th>Car</th></tr>`;
                grupo.participantes.forEach(p => {
                    html += `<tr><td>${p.nombre}</td><td>${p.puntos}</td><td>${p.carambolas}</td></tr>`;
                });
                html += `</table><h4>Enfrentamientos:</h4>`;

                // Mesas de billar (Partidos)
                grupo.partidos.forEach((partido, index) => {
                    html += `
                    <div class="mesa-billar" id="${grupo.nombre}-P${index}">
                        <div class="jugador">${partido.j1.nombre} <span class="badge ${partido.j1.claseColor}">${partido.j1.meta}</span></div>
                        <div class="vs">VS</div>
                        <div class="jugador">${partido.j2.nombre} <span class="badge ${partido.j2.claseColor}">${partido.j2.meta}</span></div>
                        <div class="marcador">- : -</div>
                    </div>`;
                });

                html += `</div>`;
                contenedor.innerHTML += html;
            });
        }
    </script>
</body>
</html>
